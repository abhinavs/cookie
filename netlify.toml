[build]
  command = "bundle exec jekyll build"

[context.production.environment]
  JEKYLL_ENV = "production"
  NODE_VERSION = "20"

[context.branch-deploy.environment]
  JEKYLL_ENV = "staging"
  NODE_VERSION = "20"

[context.deploy-preview.environment]
  JEKYLL_ENV = "staging"
  NODE_VERSION = "20"
